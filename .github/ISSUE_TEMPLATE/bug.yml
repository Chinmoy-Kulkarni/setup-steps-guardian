name: Bug report
description: Report a reproducible SetupStepsGuardian defect without sensitive data.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include source code, logs, tokens, webhook payloads, secrets, or payment details.

  - type: input
    id: version
    attributes:
      label: Version
      description: Action commit SHA or hosted release version.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - GitHub Action
        - Policy engine
        - Public workflow study
        - Dashboard preview
        - Worker backend
        - Documentation
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
      description: Use a minimal public fixture or redact repository-specific values.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed source, logs, credentials, tokens, secrets, webhook payloads, and payment details.
          required: true
